<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstraSec</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-font;}body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;}a{color:#635bff;text-decoration:none;}a:hover{color:#fff;}ul{list-style:none;}button{cursor:pointer;padding:8px 16px;background:#635bff;color:#fff;border:none;border-radius:4px;font-size:14px;}button:hover{background:#5a4eff;} .card{background:#1a1a1a;padding:20px;margin:10px 0;border-radius:8px;border:1px solid #333;} .card h3{margin-bottom:10px;} .status-online{color:#06d6a0;} .status-offline{color:#666;} .container{max-width:1200px;margin:0 auto;padding:20px;}
  </style>
</head>
<body>
<div class="container">
  <header style="margin-bottom:2rem;">
    <h1 style="font-size:2rem;margin-bottom:8px;">AstraSec</h1>
    <p style="color:#888;font-size:0.9rem;">Project • Upload • Loader • Overview</p>
  </header>

  <!-- CREATE PROJECT -->
  <section id="create" style="display:block;">
    <div class="card">
      <h2>Create New Project</h2>
      <form id="create-form">
        <div style="margin-bottom:1rem;">
          <label style="display:block;margin-bottom:6px;">Project Name</label>
          <input type="text" id="proj-name" placeholder="e.g. Project 1" style="width:100%;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;margin-bottom:1rem;">
        </div>
        <div style="margin-bottom:1rem;">
          <label style="display:block;margin-bottom:6px;">Upload EXE</label>
          <input type="file" id="proj-exe" accept=".exe" style="width:100%;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;">
        </div>
        <button type="submit" style="width:100%;padding:8px;background:#635bff;">Create App</button>
      </form>
    </div>
  </section>

  <!-- PROJECT OVERVIEW -->
  <section id="overview" style="display:none;">
    <div class="card">
      <h2 id="overview-title">Project Overview</h2>
      <div id="proj-info">
        <!-- Project info loads here -->
      </div>
      <form id="update-exe">
        <div style="margin-bottom:1rem;">
          <label style="display:block;margin-bottom:6px;">Update EXE</label>
          <input type="file" id="new-exe" accept=".exe" style="width:100%;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;">
        </div>
        <button type="submit" style="width:100%;background:#635bff;">Update EXE</button>
      </form>
    </div>
    <button onclick="showCreate()" style="margin-top:10px;background:#444;">← Back to Projects</button>
  </section>

  <!-- USERS PAGE -->
  <section id="users" style="display:none;">
    <div class="card">
      <h2>Users Overview</h2>
      <p>Online users: <span id="online-count">0</span></p>
      <p style="color:#888;font-size:0.8rem;">Tracking project usage activity</p>
    </div>
    <button onclick="showCreate()" style="margin-top:10px;background:#444;">← Back to Projects</button>
  </section>
</div>

<script>
  // State from localStorage
  let projects = JSON.parse(localStorage.getItem('astrasec_projs') || '[]');
  let onlineUsers = 0;

  // Render projects grid
  function renderProjects() {
    const createSection = document.getElementById('create');
    const overviewSection = document.getElementById('overview');
    const usersSection = document.getElementById('users');

    // Hide all sections
    createSection.style.display = 'none';
    overviewSection.style.display = 'none';
    usersSection.style.display = 'none';

    // If no projects, show create
    if (projects.length === 0) {
      createSection.style.display = 'block';
      return;
    }

    // Show overview for first project
    const firstProj = projects[0];
    document.getElementById('overview-title').textContent = `Project Overview: ${firstProj.name}`;
    document.getElementById('proj-info').innerHTML = `
      <p><strong>EXE Status:</strong> ${firstProj.exe ? 'Uploaded' : 'No EXE'}</p>
      <p><strong>Online users:</strong> <span class="status-online" id="first-online">${firstProj.online || 0}</span></p>
      <p><strong>Project ID:</strong> ${firstProj.id}</p>
    `;
    overviewSection.style.display = 'block';

    // Users count
    onlineUsers = Math.max(...projects.map(p => p.online || 0), 0);
    document.getElementById('online-count').textContent = onlineUsers;

    // Users grid
    let usersHtml = '<h3>Recent Activity</h3>';
    projects.forEach((p, i) => {
      usersHtml += `<p style="margin:4px 0;">Project ${i+1} (${p.name}): <span class="${p.online > 0 ? 'status-online' : 'status-offline'}">${p.online || 0} online</span></p>`;
    });
    usersSection.innerHTML = usersHtml;
    usersSection.style.display = 'block';
  }

  // Show create section
  function showCreate() {
    document.getElementById('create').style.display = 'block';
    document.getElementById('overview').style.display = 'none';
    document.getElementById('users').style.display = 'none';
  }

  // Create project form
  document.getElementById('create-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('proj-name').value.trim();
    const file = document.getElementById('proj-exe').files[0];

    if (!name || !file) return alert('Enter project name and upload EXE');

    const reader = new FileReader();
    reader.onload = e => {
      projects.push({
        id: Date.now().toString(),
        name,
        exe: 'EXE uploaded',
        online: 0
      });
      localStorage.setItem('astrasec_projs', JSON.stringify(projects));
      renderProjects();
      alert('Project created! View overview to update EXE.');
    };
    reader.readAsDataURL(file);
  });

  // Update EXE form
  document.getElementById('update-exe').addEventListener('submit', e => {
    e.preventDefault();
    const projId = document.getElementById('overview').style.display !== 'none' ? 'current' : '0';
    const proj = projects.find(p => p.id === 'current' || projects[0]?.id === 'current');
    if (!proj) return alert('No project selected');

    const file = document.getElementById('new-exe').files[0];
    if (!file) return alert('Select an EXE file');

    const reader = new FileReader();
    reader.onload = e => {
      proj.exe = 'EXE updated';
      localStorage.setItem('astrasec_projs', JSON.stringify(projects));
      renderProjects();
      alert('EXE updated successfully!');
    };
    reader.readAsDataURL(file);
  });

  // Initialize
  renderProjects();
</script>
</body>
</html>
