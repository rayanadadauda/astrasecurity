<!DOCTYPE html>
<html>
<head>
  <title>AstraSec</title>
  <style>
    body {font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 40px; line-height: 1.6;}
    h1 {font-size: 28px; margin-bottom: 8px;}
    .project {background: #111; padding: 20px; margin: 10px 0; border-radius: 8; border: 1px solid #333;}
    .online {color: #10b981; font-weight: bold;}
    .online-offline {color: #6b7280;}
    button {padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4; cursor: pointer; margin: 5px;}
    button:disabled {background: #444; cursor: not-allowed;}
    input {padding: 8px; margin: 5px; width: 300px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4;}
    input.file {width: 100%;}
    .status {margin-top: 20; font-size: 12px; opacity: 0.7;}
    .loader-bg {background: #0a0a0a; color: #fff; padding: 40px; text-align: center; min-height: 200px;}
    .loader-btn {padding: 12px 30px; background: #1d4ed8; color: #fff; border: none; border-radius: 6; font-size: 16px; cursor: pointer; margin-top: 20px;}
  </style>
</head>
<body>

<h1>AstraSec</h1>

<div id="projects"></div>

<h2>Create Project</h2>
<input id="projName" placeholder="Project name e.g. 'Project 1'">
<input type="file" id="projExe" accept=".exe" class="file">
<button onclick="createProject()">Create App</button>
<div class="status" id="status"></div>

<script>
  // Load projects from localStorage or start empty
  let projects = JSON.parse(localStorage.getItem('astrasec_projects') || '[]');
  let loaderIdCounter = 0;

  // Render project list
  function render() {
    const container = document.getElementById('projects');
    if (!projects.length) {
      container.innerHTML = '<p style="opacity: 0.7;">No projects yet. Create one above.</p>';
      return;
    }
    let html = '';
    projects.forEach((p, i) => {
      const onlineText = p.online > 0 ? `<span class="online">Online: ${p.online}</span>` : '<span class="online-offline">Offline</span>';
      html += `<div class="project">
        <strong>${p.name}</strong> ${onlineText}
        <button onclick="downloadLoader(${i})" style="margin-left: 10px;">Download Loader</button>
      </div>`;
    });
    container.innerHTML = html;
  }

  // Create new project
  function createProject() {
    const nameInput = document.getElementById('projName');
    const name = nameInput.value.trim();
    const file = document.getElementById('projExe').files[0];

    if (!name || !file) {
      document.getElementById('status').textContent = '⚠ Name and EXE required';
      return;
    }

    // Read file and store as base64 text
    const reader = new FileReader();
    reader.onload = function(e) {
      const dataUrl = e.target.result;
      // Store: name + first part of data + online: 0
      projects.push({
        id: Date.now(),
        name: name,
        exe: dataUrl,
        online: 0,
        loaderId: `loader-${loaderIdCounter++}`
      });
      localStorage.setItem('astrasec_projects', JSON.stringify(projects));
      nameInput.value = '';
      document.getElementById('projExe').value = '';
      document.getElementById('status').textContent = '✓ Project created!';
      render();
    };
    reader.readAsDataURL(file);
  }

  // Download loader for a project
  function downloadLoader(i) {
    const p = projects[i];
    if (!p) return alert('Project not found');

    // Show loader in a new tab
    const loaderHtml = `
      <!DOCTYPE html>
      <html>
      <head>
        <title>AstraSec Loader</title>
        <style>
          body {font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 50px; text-align: center; font-size: 18px;}
          .spinner {border: 4px solid #2f3542; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; margin: 20px auto; animation: spin 1s linear infinite;}
          @keyframes spin {to {transform: rotate(360deg);}}
        </style>
      </head>
      <body>
        <div class="spinner"></div>
        <h2>Loading...</h2>
        <p>Project: ${p.name}</p>
        <p>Fetching cheat from AstraSec server...</p>
        <p class="status">This loader fetches your EXE from the AstraSec API and runs it in memory.</p>
        <p class="status small">Online trackers will update the count above.</p>
        <script>
          // Simulate loading process
          console.log('AstraSec Loader starting...');
          console.log('Project:', '${p.name}');
          console.log('Loader ID: loader-demo');

          // Update online count periodically (simulated)
          function updateOnline() {
            const projects = ${JSON.stringify(projects)};
            const pIndex = projects.findIndex(x => x.loaderId === 'loader-demo');
            if (pIndex >= 0) {
              // In real implementation, this would call /api/heartbeat
              document.querySelector('.small').textContent = 'Online users: checking...';
            }
          }
          setInterval(updateOnline, 5000);

          // After "load", show success
          setTimeout(() => {
            console.log('Cheat loaded successfully!');
            console.log('Executing in memory...');
            alert('Cheat loaded! AstraSec is running.');
          }, 3000);
        </script>
      </body>
      </html>
    `;

    // Open in new tab
    const blob = new Blob([loaderHtml], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }

  // Initialize
  render();
</script>

</body>
</html>
